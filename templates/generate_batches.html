<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Location-Based Batches</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f8f9fa;
      color: #333;
    }

    h2 {
      color: #2c3e50;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #219150;
    }

    #status {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Generate Today’s Order Batches by Location</h2>
  <p>This will group unbatched orders based on geographical proximity (latitude & longitude), capped by 25kg or 30 orders per batch.</p>

  <button onclick="generateBatches()">Generate Batches</button>
  <p id="status"></p>

  <script>
    async function generateBatches() {
      const status = document.getElementById('status');
      status.innerText = "⏳ Generating batches, please wait...";

      try {
        const res = await fetch('/batches/today', {
          method: 'POST'
        });

        const result = await res.json();
        if (res.ok) {
          status.innerText = '✅ Location-based batches created successfully!';
        } else {
          status.innerText = '❌ Error: ' + result.detail;
        }
      } catch (err) {
        status.innerText = '❌ Failed to connect to server.';
      }
    }
  </script>

</body>
</html>
